name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar frontend
        run: npm run build

      - name: Agregar y sincronizar Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copiar sonido oficial de Plan Salud
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/plan_salud_signature.wav android/app/src/main/res/raw/plan_salud_signature.wav
          mkdir -p public
          cp assets/plan_salud_signature.wav public/plan_salud_signature.wav

      - name: Configurar permisos Android
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          texto = manifest.read_text(encoding="utf-8")

          permisos = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-feature android:name="android.hardware.location.gps" android:required="false" />',
          ]

          faltantes = [
              permiso for permiso in permisos
              if permiso not in texto
          ]

          if faltantes:
              coincidencia = re.search(r"<manifest\b[^>]*>", texto)

              if not coincidencia:
                  raise RuntimeError(
                      "No se encontró la etiqueta <manifest> en AndroidManifest.xml"
                  )

              posicion = coincidencia.end()

              insercion = (
                  "\n\n    "
                  + "\n    ".join(faltantes)
                  + "\n"
              )

              texto = (
                  texto[:posicion]
                  + insercion
                  + texto[posicion:]
              )

              manifest.write_text(
                  texto,
                  encoding="utf-8"
              )

          print("AndroidManifest.xml resultante:")
          print(manifest.read_text(encoding="utf-8"))
          PY

      - name: Compilar APK de prueba
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: plan-salud-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
