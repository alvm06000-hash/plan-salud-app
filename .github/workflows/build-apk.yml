name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar frontend
        run: npm run build

      - name: Agregar y sincronizar Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configurar permisos Android
        run: |
          python -c 'from pathlib import Path; import re; p=Path("android/app/src/main/AndroidManifest.xml"); t=p.read_text(encoding="utf-8"); permisos=["android.permission.POST_NOTIFICATIONS","android.permission.SCHEDULE_EXACT_ALARM"]; m=re.search(r"<manifest\b[^>]*>",t); assert m, "No se encontró la etiqueta manifest"; inserciones=""; 
          for permiso in permisos:
              linea=f"<uses-permission android:name=\"{permiso}\" />"
              if linea not in t:
                  inserciones += "\n    " + linea
          if inserciones:
              t=t[:m.end()]+inserciones+t[m.end():]
          p.write_text(t,encoding="utf-8")'

      - name: Compilar APK de prueba
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: plan-salud-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
