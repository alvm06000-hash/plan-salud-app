name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Compilar el frontend
        run: npm run build

      - name: Agregar y sincronizar Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Habilitar alarmas exactas en Android
        run: |
          python - <<'PY2'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in text:
              text = text.replace("<manifest", "<manifest", 1)
              pos = text.find(">") + 1
              text = text[:pos] + "\n    " + permission + text[pos:]
              manifest.write_text(text)
          PY2

      - name: Compilar APK de prueba (debug, sin firmar)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: plan-salud-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
